name: Initiative
description: A portfolio-level outcome spanning a quarter or more; parent of Epics
title: "[Initiative]: "
type: Initiative
body:
  - type: markdown
    attributes:
      value: Initiatives describe outcomes, not tasks. Attach Epics as sub-issues once created.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: The change in the world we want to achieve.
    validations:
      required: true
  - type: textarea
    id: why-now
    attributes:
      label: Why now?
      description: Evidence, user need or strategic reason this matters this quarter.
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: Success metrics
      value: |
        - [ ] 
    validations:
      required: true
  - type: dropdown
    id: quarter
    attributes:
      label: Target quarter
      options:
        - 2026 Q4
        - 2027 Q1
        - 2027 Q2
        - 2027 Q3
        - 2027 Q4
        - Later
    validations:
      required: true
