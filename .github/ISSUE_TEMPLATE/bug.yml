name: Bug report
description: Something is broken or behaves unexpectedly
title: "[Bug]: "
type: Bug
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug. Please search existing issues first to avoid duplicates.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - iOS
        - iPadOS
        - macOS
        - watchOS
        - tvOS
        - Android
        - Web
        - Worker / backend
        - MCP server
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / build
      placeholder: e.g. 1.4.2 (build 87), commit SHA, or deploy URL
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or recordings
      description: Paste relevant log output (automatically formatted as code) or drag in screenshots.
      render: shell
